<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Join Our Club</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Student Registration Form</h2>

        <form action="#">

            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Phone Number:</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Course:</label>
            <input type="text" placeholder="Enter your course">

            <label>Year:</label>
            <select>
                <option>Select Year</option>
                <option>First Year</option>
                <option>Second Year</option>
                <option>Third Year</option>
                <option>Fourth Year</option>
            </select>

            <p>Why do you want to join our club?</p>

            <input type="radio" name="reason"> Learning
            <br>

            <input type="radio" name="reason"> Activities
            <br>

            <input type="radio" name="reason"> Making Friends

            <br><br>

            <label>About Yourself:</label>
            <textarea rows="4" placeholder="Write something about yourself"></textarea>

            <br>

            <input type="checkbox" required>
            I agree to the club rules.

            <br><br>

            <input type="submit" value="Register">

        </form>
    </main>

    <footer>
        <p>Copyright 2026 Campus Connect Created by Mirza Kamil Beg</p>

    </footer>

</body>
</html>
